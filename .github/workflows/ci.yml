name: CI

# Pull requests: test only (no preview environment; production is the only one).
# Push to main: test, then apply D1 migrations and deploy the production Worker.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer main push waits for the current production deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test .github/scripts/review-gate.test.cjs
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: production
      url: https://parking-reservation-bot.huang-inc.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migrations run before the new code ships, so they must stay backward compatible.
      - run: npx wrangler d1 migrations apply parking-reservation-bot --remote
      - run: npx wrangler deploy
      - name: Smoke check
        run: curl -fsS https://parking-reservation-bot.huang-inc.workers.dev/ >/dev/null
